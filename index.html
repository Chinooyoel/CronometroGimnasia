<!DOCTYPE html>
<html>

<head>
    <title>Cronometro</title>
    <link rel="icon" href="img/alarma-3d.ico" type="image/icon type">
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css?family=Roboto+Mono:400,500,700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="./main.js"></script>
    <link href="css/estilo.css" rel="stylesheet">
    <link href="css/bootstrap.light.css" rel="stylesheet">
</head>

<body>
    <section class="principal">
        <article>
            <div class="temporizador">Temporizador</br> <span id="temporizador">0</div>
        </article>
        <article>
            <div class="cronometer" id="cronometer">00:00:00</span>
            </div>
            <div class="menu_botones">
                <button id="startCronometer" class="btn-success">Iniciar</button>
                <button id="pauseCronometer" class="btn-danger">Parar</button>
                <button id="restoreCronometer" class="btn-danger">Restablecer</button>
            </div>
            <div class="menu_botones">
                <button id="createExercise" class="btn-primary">Nuevo Ejercicio</button>
            </div>
        </article>
    </section>

    <section id="container" class="principal"></section>
</body>

</html>
